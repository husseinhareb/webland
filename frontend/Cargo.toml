# Standalone crate (own workspace) so it builds for wasm32 independently of the
# backend workspace while still sharing the protocol crate by path.
[workspace]

[package]
name = "webland-frontend"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/husseinhareb/webland"
publish = false

# The same lints the backend workspace sets, so "clean" means one thing across
# both halves. The cast allows scattered through the frontend are pedantic's.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dependencies]
# The wire format and shared vocabulary, verbatim with the backend. No drift.
webland-protocol = { path = "../backend/crates/webland-protocol" }
webland-core = { path = "../backend/crates/webland-core" }

leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
# Widened as the frontend reaches for WebCodecs.
features = [
    "Window", "Document", "Element", "EventTarget", "Location", "DomRect", "CssStyleDeclaration",
    "WebSocket", "BinaryType", "MessageEvent", "Event",
    "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "HtmlInputElement",
    "PointerEvent", "PointerEventInit", "MouseEvent", "MouseEventInit", "KeyboardEvent",
    "HtmlElement",
    "Navigator", "Clipboard", "ClipboardEvent", "DataTransfer",
    "Performance",
    "VideoDecoder", "VideoDecoderConfig", "VideoDecoderInit", "VideoFrame", "DomRectReadOnly", "CodecState",
    "EncodedVideoChunk", "EncodedVideoChunkInit", "EncodedVideoChunkType",
    "console",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
